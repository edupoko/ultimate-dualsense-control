[project]
name = "dualsense-led"
version = "0.1.0"
description = "Controle dos LEDs do DualSense por um ícone na bandeja do sistema (Linux)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "evdev>=1.7"]

[project.scripts]
dualsense-led = "dualsense_led.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dualsense_led"]
